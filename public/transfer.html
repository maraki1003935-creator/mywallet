<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transfer Money</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:20px;

}

.container{

max-width:450px;

margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,.2);

}

input{

width:100%;

padding:10px;

margin-top:10px;

margin-bottom:15px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

background:#007bff;

color:white;

border:none;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#0056b3;

}

#message{

margin-top:20px;

font-weight:bold;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h2>Transfer Money</h2>

<input
type="text"
id="receiver"
placeholder="Receiver Phone Number">

<input
type="number"
id="amount"
placeholder="Amount">

<button id="transferBtn">

Send Money

</button>

<p id="message"></p>

</div>

<script src="transfer.js"></script>

</body>

</html>
