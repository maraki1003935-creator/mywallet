<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Deposit History</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

padding:20px;

}

h2{

text-align:center;

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

th,td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}

th{

background:#28a745;

color:white;

}

</style>

</head>

<body>

<h2>Deposit History</h2>

<table>

<thead>

<tr>

<th>Amount</th>

<th>Status</th>

<th>Reference</th>

<th>Date</th>

</tr>

</thead>

<tbody id="depositTable">

</tbody>

</table>

<script>

const phone = localStorage.getItem("phone");

async function loadDeposits(){

    const res = await fetch("/deposit-history/" + phone);

    const deposits = await res.json();

    const table = document.getElementById("depositTable");

    table.innerHTML = "";

    deposits.forEach(item=>{

        table.innerHTML += `

        <tr>

        <td>${item.amount} ETB</td>

        <td>${item.status}</td>

        <td>${item.reference || "-"}</td>

        <td>${new Date(item.createdAt).toLocaleString()}</td>

        </tr>

        `;

    });

}

loadDeposits();

</script>

</body>

</html>
