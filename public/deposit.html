<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Deposit</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

h2{
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

.info{
background:#fff8dc;
padding:10px;
margin-top:15px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Deposit Money</h2>

<div class="info">

<b>Telebirr Number</b><br>

0904489434

<br><br>

Minimum Deposit:
<b>5000 ETB</b>

<br>

Maximum Deposit:
<b>300000 ETB</b>

</div>

<form id="depositForm">

<input
type="text"
id="phone"
placeholder="Phone Number"
required>

<input
type="number"
id="amount"
placeholder="Deposit Amount"
required>

<input
type="file"
id="screenshot"
accept="image/*"
required>

<button type="submit">

Submit Deposit

</button>

</form>

</div>

<script src="deposit.js"></script>

</body>

</html>
