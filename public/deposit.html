<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
}

.notice{
background:#e8f5e9;
padding:15px;
border-radius:8px;
margin-bottom:20px;
line-height:1.7;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#28a745;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#218838;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Deposit</h2>

<div class="notice">

<b>Minimum Deposit:</b> 5,000 ETB<br><br>

<b>Maximum Deposit:</b> 300,000 ETB<br><br>

<b>Deposit To Telebirr:</b><br>

0904489434<br><br>

After sending the money, enter the amount below and upload your payment screenshot.

</div>

<form id="depositForm" enctype="multipart/form-data">

<label>Phone Number</label>

<input
type="text"
id="phone"
readonly>

<label>Deposit Amount (ETB)</label>

<input
type="number"
id="amount"
min="5000"
max="300000"
placeholder="Enter Amount">

<label>Payment Screenshot</label>

<input
type="file"
id="screenshot"
accept="image/*">

<button type="submit">

Submit Deposit

</button>

</form>

<p id="message"></p>

</div>

<script src="deposit.js"></script>

</body>

</html>
