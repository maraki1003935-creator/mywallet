<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Manage Users</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:20px;
}

h2{
text-align:center;
}

input{

width:300px;
padding:10px;
margin-bottom:20px;

}

table{

width:100%;
border-collapse:collapse;
background:white;

}

th,td{

border:1px solid #ddd;
padding:10px;
text-align:center;

}

th{

background:#0d6efd;
color:white;

}

button{

padding:6px 12px;
margin:2px;
cursor:pointer;

}

</style>

</head>

<body>

<script>

const token=localStorage.getItem("adminToken");

if(!token){

location.href="admin-login.html";

}

</script>

<h2>Manage Users</h2>

<input
type="text"
id="search"
placeholder="Search phone number"
onkeyup="searchUser()">

<table>

<thead>

<tr>

<th>Phone</th>

<th>Balance</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

<script src="users.js"></script>

</body>

</html>
