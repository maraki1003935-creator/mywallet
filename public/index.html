<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>

        <p>Enter your phone number</p>

        <input
            type="tel"
            id="phone"
            placeholder="+2519XXXXXXXX">

        <br><br>

        <button id="sendBtn">
            Continue
        </button>

        <p id="message"></p>

<input
    type="text"
    id="otp"
    placeholder="Enter OTP">

<br><br>

<button id="verifyBtn">
    Verify OTP
</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
