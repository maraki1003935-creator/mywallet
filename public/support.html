<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Support</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
}

.box{
width:400px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input,textarea{

width:100%;
padding:10px;
margin-top:10px;
box-sizing:border-box;

}

textarea{

height:120px;
resize:none;

}

button{

width:100%;
padding:12px;
margin-top:15px;
background:#007bff;
color:white;
border:none;
cursor:pointer;

}

</style>

</head>

<body>

<div class="box">

<h2>Customer Support</h2>

<input
type="text"
id="subject"
placeholder="Subject">

<textarea
id="message"
placeholder="Describe your problem..."></textarea>

<button id="sendBtn">

Send Message

</button>

</div>

<script src="support.js"></script>

</body>

</html>
