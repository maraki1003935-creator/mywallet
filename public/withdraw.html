<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:0;

padding:20px;

}

.container{

max-width:450px;

margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,.2);

}

h2{

text-align:center;

}

.info{

background:#fff8dc;

padding:15px;

border-radius:8px;

margin-bottom:20px;

line-height:28px;

}

label{

display:block;

margin-top:15px;

font-weight:bold;

}

input{

width:100%;

padding:10px;

margin-top:5px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

margin-top:20px;

background:#28a745;

color:white;

border:none;

border-radius:6px;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#1f7d36;

}

#message{

margin-top:20px;

text-align:center;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2>Withdraw</h2>

<div class="info">

<b>Minimum Withdrawal:</b> 10,000 ETB

<br><br>

<b>Maximum Withdrawal:</b> 400,000 ETB

<br><br>

Please enter your Telebirr phone number and the amount you want to withdraw.

After submitting, a unique withdrawal code will be generated.

The administrator will review your request.

</div>

<form id="withdrawForm">

<label>Your Phone</label>

<input
type="text"
id="phone"
readonly>

<label>Telebirr Number</label>

<input
type="text"
id="telebirr"
placeholder="09XXXXXXXX">

<label>Withdrawal Amount</label>

<input
type="number"
id="amount"
placeholder="Enter amount">

<button type="submit">

Submit Withdrawal

</button>

</form>

<p id="message"></p>

</div>

<script src="withdraw.js"></script>

</body>

</html>
