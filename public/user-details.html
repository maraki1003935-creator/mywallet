<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>User Details</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

padding:20px;

}

.card{

background:white;

padding:20px;

border-radius:10px;

margin-bottom:20px;

box-shadow:0 0 10px #ccc;

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

th,td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}

th{

background:#007bff;

color:white;

}

h2{

text-align:center;

}

</style>

</head>

<body>

<h2>User Details</h2>

<div class="card">

<h3>Profile</h3>

<p><b>Phone:</b> <span id="phone"></span></p>

<p><b>Name:</b> <span id="name"></span></p>

<p><b>Email:</b> <span id="email"></span></p>

<p><b>Balance:</b> <span id="balance"></span> ETB</p>

<p><b>Referral Earnings:</b> <span id="referral"></span> ETB</p>

<p><b>Invited Users:</b> <span id="invited"></span></p>

</div>

<h3>Deposits</h3>

<table>

<thead>

<tr>

<th>Amount</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>

<tbody id="depositTable">

</tbody>

</table>

<br>

<h3>Withdrawals</h3>

<table>

<thead>

<tr>

<th>Amount</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>

<tbody id="withdrawTable">

</tbody>

</table>

<br>

<h3>Transactions</h3>

<table>

<thead>

<tr>

<th>Type</th>

<th>Amount</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>

<tbody id="transactionTable">

</tbody>

</table>

<script src="user-details.js"></script>

</body>

</html>
