<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:350px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#0d6efd;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input
type="text"
id="username"
placeholder="Admin Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

<script>

async function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const res=await fetch("/admin/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
password

})

});

const data=await res.json();

if(data.success){

localStorage.setItem("adminToken",data.token);

location.href="admin.html";

}else{

alert(data.message);

}

}

</script>

</body>
</html>
