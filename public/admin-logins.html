<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Admin Login</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

}

.box{

width:350px;

margin:100px auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px gray;

}

input{

width:100%;

padding:10px;

margin-top:10px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

margin-top:15px;

background:#007bff;

color:white;

border:none;

cursor:pointer;

}

</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

<script src="admin-login.js"></script>

</body>

</html>
