<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Withdrawal History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .balance-title {
            font-size: 15px;
            color: #666;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }

        .phone {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        #message {
            text-align: center;
            padding: 15px;
            color: #666;
        }

        .withdrawal {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 6px 0;
        }

        .label {
            color: #666;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            font-weight: bold;
        }

        .approved {
            color: green;
        }

        .pending {
            color: orange;
        }

        .rejected {
            color: red;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 13px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .refresh-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .refresh-button:active {
            transform: scale(0.98);
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Withdrawal History</h1>


    <!-- ============================= -->
    <!-- USER INFORMATION -->
    <!-- ============================= -->

    <div class="balance-box">

        <div class="balance-title">
            Logged-in Phone
        </div>

        <div
            id="phone"
            class="phone">
            Loading...
        </div>

        <br>

        <div class="balance-title">
            Current Wallet Balance
        </div>

        <div
            id="balance"
            class="balance">
            Loading...
        </div>

    </div>


    <!-- ============================= -->
    <!-- REFRESH -->
    <!-- ============================= -->

    <button
        class="refresh-button"
        onclick="loadWithdrawalHistory()">

        Refresh History

    </button>


    <!-- ============================= -->
    <!-- MESSAGE -->
    <!-- ============================= -->

    <div id="message">
        Loading withdrawal history...
    </div>


    <!-- ============================= -->
    <!-- WITHDRAWAL LIST -->
    <!-- ============================= -->

    <div id="withdrawals"></div>


    <!-- ============================= -->
    <!-- BACK -->
    <!-- ============================= -->

    <a
        href="dashboard.html"
        class="back-button">

        Back to Dashboard

    </a>

</div>


<script>

/* =====================================================
   GET LOGGED-IN USER PHONE
   ===================================================== */

function getUserPhone() {

    let phone =
        localStorage.getItem("phone") ||
        localStorage.getItem("userPhone") ||
        sessionStorage.getItem("phone") ||
        sessionStorage.getItem("userPhone");


    /* Check saved user object */

    if (!phone) {

        try {

            const savedUser =
                JSON.parse(
                    localStorage.getItem("user")
                );

            if (
                savedUser &&
                savedUser.phone
            ) {

                phone =
                    savedUser.phone;

            }

        } catch (error) {

            console.log(
                "Could not read saved user."
            );

        }

    }


    if (!phone) {

        console.log(
            "NO LOGGED-IN PHONE FOUND"
        );

        return null;

    }


    return String(phone).trim();

}


/* =====================================================
   LOAD WALLET BALANCE
   ===================================================== */

async function loadWalletBalance() {

    const phone =
        getUserPhone();


    if (!phone) {

        document.getElementById(
            "balance"
        ).textContent = "0 ETB";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/wallet/" +
                encodeURIComponent(phone) +
                "?t=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Cache-Control":
                            "no-cache",
                        "Pragma":
                            "no-cache"
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "WALLET RESPONSE:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            document.getElementById(
                "balance"
            ).textContent = "0 ETB";

            return;

        }


        const balance =
            Number(
                data.balance || 0
            );


        document.getElementById(
            "balance"
        ).textContent =
            balance.toLocaleString(
                "en-US"
            ) + " ETB";


    } catch (error) {

        console.error(
            "WALLET ERROR:",
            error
        );

        document.getElementById(
            "balance"
        ).textContent =
            "0 ETB";

    }

}


/* =====================================================
   LOAD WITHDRAWAL HISTORY
   ===================================================== */

async function loadWithdrawalHistory() {

    const message =
        document.getElementById(
            "message"
        );

    const container =
        document.getElementById(
            "withdrawals"
        );


    const phone =
        getUserPhone();


    console.log(
        "WITHDRAWAL PHONE:",
        phone
    );


    /* Show phone */

    document.getElementById(
        "phone"
    ).textContent =
        phone || "Not logged in";


    if (!phone) {

        message.textContent =
            "Please login first.";

        container.innerHTML = "";

        return;

    }


    try {

        message.textContent =
            "Loading withdrawal history...";


        /*
         * IMPORTANT:
         *
         * This is the API route expected
         * from your admin.js:
         *
         * /api/admin/withdrawals/:phone
         */

        const url =
            "/api/admin/withdrawals/" +
            encodeURIComponent(phone) +
            "?t=" +
            Date.now();


        console.log(
            "WITHDRAWAL API URL:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Cache-Control":
                            "no-cache",
                        "Pragma":
                            "no-cache"
                    }
                }
            );


        console.log(
            "WITHDRAWAL HTTP STATUS:",
            response.status
        );


        /*
         * Read response as text first.
         *
         * This prevents:
         * Unexpected token '<'
         *
         * when the server sends HTML.
         */

        const text =
            await response.text();


        console.log(
            "WITHDRAWAL RAW RESPONSE:",
            text
        );


        let data;


        try {

            data =
                JSON.parse(text);

        } catch (jsonError) {

            console.error(
                "SERVER DID NOT RETURN JSON:",
                text
            );


            message.textContent =
                "Server returned an invalid response. Check the API route.";

            container.innerHTML = "";

            return;

        }


        console.log(
            "WITHDRAWAL API DATA:",
            data
        );


        if (!response.ok) {

            message.textContent =
                data.message ||
                "Could not load withdrawal history.";

            container.innerHTML = "";

            return;

        }


        if (!data.success) {

            message.textContent =
                data.message ||
                "Could not load withdrawal history.";

            container.innerHTML = "";

            return;

        }


        /*
         * Support both:
         *
         * { withdrawals: [...] }
         *
         * and
         *
         * [...]
         */

        const withdrawals =
            Array.isArray(
                data.withdrawals
            )
                ? data.withdrawals
                : Array.isArray(data)
                    ? data
                    : [];


        container.innerHTML = "";


        if (
            withdrawals.length === 0
        ) {

            message.textContent =
                "No withdrawal history found.";

            return;

        }


        message.textContent =
            "";


        withdrawals.forEach(
            function (withdraw) {

                const box =
                    document.createElement(
                        "div"
                    );

                box.className =
                    "withdrawal";


                /* =========================
                   AMOUNT
                   ========================= */

                const amount =
                    Number(
                        withdraw.amount || 0
                    );


                /* =========================
                   STATUS
                   ========================= */

                const status =
                    String(
                        withdraw.status ||
                        "Pending"
                    );


                let statusClass =
                    "pending";


                if (
                    status.toLowerCase() ===
                    "approved"
                ) {

                    statusClass =
                        "approved";

                }


                if (
                    status.toLowerCase() ===
                    "rejected"
                ) {

                    statusClass =
                        "rejected";

                }


                /* =========================
                   DATE
                   ========================= */

                let dateText =
                    "Unknown date";


                if (
                    withdraw.createdAt
                ) {

                    const date =
                        new Date(
                            withdraw.createdAt
                        );


                    if (
                        !isNaN(
                            date.getTime()
                        )
                    ) {

                        dateText =
                            date.toLocaleString(
                                "en-US"
                            );

                    }

                }


                /* =========================
                   REFERENCE
                   ========================= */

                const reference =
                    withdraw.reference ||
                    withdraw._id ||
                    "N/A";


                box.innerHTML = `

                    <div class="row">

                        <span class="label">
                            Amount
                        </span>

                        <span class="amount">
                            ${amount.toLocaleString("en-US")}
                            ETB
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Status
                        </span>

                        <span class="status ${statusClass}">
                            ${status}
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Reference
                        </span>

                        <span>
                            ${reference}
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Date
                        </span>

                        <span>
                            ${dateText}
                        </span>

                    </div>

                `;


                container.appendChild(
                    box
                );

            }
        );


    } catch (error) {

        console.error(
            "WITHDRAWAL HISTORY ERROR:",
            error
        );


        message.textContent =
            "Could not load withdrawal history. Please try again.";


        container.innerHTML = "";

    }

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "WITHDRAW-HISTORY PAGE LOADED"
        );


        loadWalletBalance();

        loadWithdrawalHistory();

    }
);


/* =====================================================
   REFRESH WHEN RETURNING TO PAGE
   ===================================================== */

window.addEventListener(
    "pageshow",
    function () {

        loadWalletBalance();

        loadWithdrawalHistory();

    }
);

</script>

</body>

</html>
