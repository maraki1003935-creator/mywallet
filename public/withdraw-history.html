<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Withdraw History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: #1677ff;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .phone {
            font-size: 15px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            background: #1677ff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #1677ff;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            font-weight: bold;
        }

        .approved {
            color: #159447;
        }

        .pending {
            color: #d88a00;
        }

        .rejected {
            color: #d62828;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 25px;
        }

        .error {
            color: #d62828;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 23px;
            }

            .card {
                padding: 12px;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>💸 Withdraw History</h1>

        <div class="phone" id="userPhone">
            Loading user...
        </div>

    </div>


    <!-- BACK BUTTON -->

    <a
        href="dashboard.html"
        class="back"
    >
        ← Back to Wallet
    </a>


    <!-- HISTORY -->

    <div class="card">

        <h2>Withdraw Transactions</h2>

        <div
            id="historyContainer"
            class="loading"
        >
            Loading withdraw history...
        </div>

    </div>

</div>


<script>

    // =====================================================
    // GET LOGGED-IN PHONE
    // =====================================================

    function getUserPhone() {

        let phone =
            localStorage.getItem("phone") ||
            localStorage.getItem("userPhone") ||
            sessionStorage.getItem("phone") ||
            sessionStorage.getItem("userPhone");


        // Try saved user object

        if (!phone) {

            try {

                const user =
                    JSON.parse(
                        localStorage.getItem("user")
                    );

                if (user && user.phone) {

                    phone = user.phone;

                }

            } catch (error) {

                console.log(
                    "Could not read saved user."
                );

            }

        }


        if (!phone) {

            return null;

        }


        return String(phone).trim();

    }


    // =====================================================
    // FORMAT DATE
    // =====================================================

    function formatDate(dateValue) {

        if (!dateValue) {

            return "-";

        }

        const date =
            new Date(dateValue);


        if (isNaN(date.getTime())) {

            return "-";

        }


        return date.toLocaleString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    // =====================================================
    // STATUS CLASS
    // =====================================================

    function getStatusClass(status) {

        const value =
            String(status || "")
                .toLowerCase();


        if (value === "approved") {

            return "approved";

        }


        if (value === "pending") {

            return "pending";

        }


        if (
            value === "rejected" ||
            value === "declined"
        ) {

            return "rejected";

        }


        return "";

    }


    // =====================================================
    // LOAD WITHDRAW HISTORY
    // =====================================================

    async function loadWithdrawHistory() {

        const container =
            document.getElementById(
                "historyContainer"
            );


        const phone =
            getUserPhone();


        console.log(
            "WITHDRAW HISTORY PHONE:",
            phone
        );


        const phoneElement =
            document.getElementById(
                "userPhone"
            );


        if (phoneElement) {

            phoneElement.textContent =
                phone
                    ? "Phone: " + phone
                    : "No logged-in phone found";

        }


        if (!phone) {

            container.className = "error";

            container.innerHTML =
                "❌ Please login first.";

            return;

        }


        try {

            // =================================================
            // IMPORTANT:
            // THIS REQUEST USES THE LOGGED-IN USER PHONE
            // =================================================

            const url =
                "/withdraw/history/" +
                encodeURIComponent(phone) +
                "?t=" +
                Date.now();


            console.log(
                "REQUESTING:",
                url
            );


            const response =
                await fetch(
                    url,
                    {
                        method: "GET",
                        cache: "no-store",
                        headers: {
                            "Cache-Control":
                                "no-cache",
                            "Pragma":
                                "no-cache"
                        }
                    }
                );


            console.log(
                "HTTP STATUS:",
                response.status
            );


            const data =
                await response.json();


            console.log(
                "WITHDRAW HISTORY RESPONSE:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Server error"
                );

            }


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Could not load history"
                );

            }


            // =================================================
            // ACCEPT COMMON RESPONSE NAMES
            // =================================================

            const withdrawals =
                data.withdrawals ||
                data.history ||
                data.transactions ||
                [];


            if (
                !Array.isArray(withdrawals) ||
                withdrawals.length === 0
            ) {

                container.className = "empty";

                container.innerHTML =
                    "📭 No withdraw transactions found.";

                return;

            }


            // =================================================
            // CREATE TABLE
            // =================================================

            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Amount</th>

                            <th>Method</th>

                            <th>Status</th>

                            <th>Transaction ID</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            withdrawals.forEach(function (item) {

                const amount =
                    Number(
                        item.amount || 0
                    );


                const status =
                    item.status ||
                    "Pending";


                const method =
                    item.method ||
                    item.paymentMethod ||
                    item.bank ||
                    item.provider ||
                    "-";


                const txid =
                    item.txid ||
                    item.transactionId ||
                    item._id ||
                    "-";


                const date =
                    item.createdAt ||
                    item.date ||
                    item.createdDate;


                html += `

                    <tr>

                        <td>
                            ${formatDate(date)}
                        </td>

                        <td>
                            <strong>
                                ${amount.toLocaleString("en-US")}
                                ETB
                            </strong>
                        </td>

                        <td>
                            ${method}
                        </td>

                        <td>

                            <span
                                class="status ${getStatusClass(status)}"
                            >
                                ${status}
                            </span>

                        </td>

                        <td>
                            ${txid}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            container.className = "";

            container.innerHTML = html;


        } catch (error) {

            console.error(
                "WITHDRAW HISTORY ERROR:",
                error
            );


            container.className =
                "error";


            container.innerHTML =
                "❌ Could not load withdraw history.<br><br>" +
                error.message;

        }

    }


    // =====================================================
    // PAGE LOAD
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            console.log(
                "✅ withdraw-history.html loaded"
            );

            loadWithdrawHistory();

        }
    );


    // =====================================================
    // REFRESH WHEN USER RETURNS
    // =====================================================

    window.addEventListener(
        "pageshow",
        function () {

            loadWithdrawHistory();

        }
    );

</script>

</body>
</html>
