<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Withdrawals</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:20px;

}

h2{

text-align:center;

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

th,td{

border:1px solid #ccc;

padding:10px;

text-align:center;

}

th{

background:#007bff;

color:white;

}

button{

padding:8px 12px;

border:none;

cursor:pointer;

color:white;

margin:2px;

}

.approve{

background:green;

}

.reject{

background:red;

}

</style>

</head>

<body>

<h2>Withdrawal Requests</h2>

<table>

<thead>

<tr>

<th>Phone</th>

<th>Amount</th>

<th>Telebirr</th>

<th>Withdrawal Code</th>

<th>Date</th>

<th>Status</th>

<th>Approve</th>

<th>Reject</th>

</tr>

</thead>

<tbody id="withdrawTable">

</tbody>

</table>

<script>

async function loadWithdrawals(){

const res=await fetch("/admin/withdrawals");

const data=await res.json();

const table=document.getElementById("withdrawTable");

table.innerHTML="";

data.forEach(item=>{

table.innerHTML+=`

<tr>

<td>${item.phone}</td>

<td>${item.amount} ETB</td>

<td>${item.telebirr}</td>

<td>${item.withdrawCode}</td>

<td>${new Date(item.createdAt).toLocaleString()}</td>

<td>${item.status}</td>

<td>

<button class="approve"

onclick="approve('${item._id}')">

Approve

</button>

</td>

<td>

<button class="reject"

onclick="rejectWithdraw('${item._id}')">

Reject

</button>

</td>

</tr>

`;

});

}

async function approve(id){

const res=await fetch("/admin/withdraw/approve/"+id,{

method:"POST"

});

const data=await res.json();

alert(data.message);

loadWithdrawals();

}

async function rejectWithdraw(id){

const res=await fetch("/admin/withdraw/reject/"+id,{

method:"POST"

});

const data=await res.json();

alert(data.message);

loadWithdrawals();

}

loadWithdrawals();

</script>

</body>

</html>
