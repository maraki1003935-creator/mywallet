<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            background: #1677ff;
            color: white;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        #userPhone {
            font-size: 15px;
            opacity: .9;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            background: #1677ff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .notification {
            border-bottom: 1px solid #ddd;
            padding: 16px 5px;
        }

        .notification:last-child {
            border-bottom: none;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .notification-message {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }

        .notification-date {
            margin-top: 8px;
            font-size: 12px;
            color: #888;
        }

        .unread {
            background: #eef6ff;
            border-radius: 10px;
            padding: 15px;
        }

        .empty,
        .loading,
        .error {
            text-align: center;
            padding: 30px 10px;
        }

        .error {
            color: #d62828;
        }

        .refresh-btn {
            border: none;
            background: #1677ff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 15px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <div class="header">

        <h1>🔔 Notifications</h1>

        <div id="userPhone">
            Loading user...
        </div>

    </div>


    <!-- ========================================= -->
    <!-- BACK -->
    <!-- ========================================= -->

    <a
        href="dashboard.html"
        class="back"
    >
        ← Back to Wallet
    </a>


    <!-- ========================================= -->
    <!-- NOTIFICATIONS -->
    <!-- ========================================= -->

    <div class="card">

        <button
            class="refresh-btn"
            onclick="loadNotifications()"
        >
            🔄 Refresh
        </button>

        <div
            id="notificationsContainer"
            class="loading"
        >
            Loading notifications...
        </div>

    </div>


</div>


<script>


// =====================================================
// GET LOGGED-IN USER PHONE
// =====================================================

function getUserPhone() {

    let phone =
        localStorage.getItem("phone") ||
        localStorage.getItem("userPhone") ||
        sessionStorage.getItem("phone") ||
        sessionStorage.getItem("userPhone");


    // -----------------------------------------------
    // ALSO CHECK SAVED USER OBJECT
    // -----------------------------------------------

    if (!phone) {

        try {

            const savedUser =
                JSON.parse(
                    localStorage.getItem("user")
                );

            if (
                savedUser &&
                savedUser.phone
            ) {

                phone =
                    savedUser.phone;

            }

        } catch (error) {

            console.log(
                "Could not read saved user."
            );

        }

    }


    if (!phone) {

        return null;

    }


    return String(phone).trim();

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(dateValue) {

    if (!dateValue) {

        return "";

    }


    const date =
        new Date(dateValue);


    if (isNaN(date.getTime())) {

        return "";

    }


    return date.toLocaleString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


// =====================================================
// LOAD NOTIFICATIONS
// =====================================================

async function loadNotifications() {

    const container =
        document.getElementById(
            "notificationsContainer"
        );


    const phone =
        getUserPhone();


    console.log(
        "NOTIFICATION PHONE:",
        phone
    );


    // -----------------------------------------------
    // SHOW PHONE
    // -----------------------------------------------

    const phoneElement =
        document.getElementById(
            "userPhone"
        );


    if (phoneElement) {

        phoneElement.textContent =
            phone
                ? "Phone: " + phone
                : "No logged-in phone found";

    }


    // -----------------------------------------------
    // NO PHONE
    // -----------------------------------------------

    if (!phone) {

        container.className =
            "error";

        container.innerHTML =
            "❌ Please login first.";

        return;

    }


    try {

        container.className =
            "loading";

        container.innerHTML =
            "Loading notifications...";


        // =================================================
        // NOTIFICATION API
        // =================================================

        const url =
            "/api/notifications/" +
            encodeURIComponent(phone) +
            "?t=" +
            Date.now();


        console.log(
            "REQUESTING:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        console.log(
            "NOTIFICATION HTTP STATUS:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "NOTIFICATION API RESPONSE:",
            data
        );


        // -----------------------------------------------
        // SERVER ERROR
        // -----------------------------------------------

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Server error"
            );

        }


        // -----------------------------------------------
        // API ERROR
        // -----------------------------------------------

        if (!data.success) {

            throw new Error(
                data.message ||
                "Could not load notifications"
            );

        }


        // =================================================
        // ACCEPT COMMON RESPONSE NAMES
        // =================================================

        const notifications =
            data.notifications ||
            data.notification ||
            data.items ||
            data.results ||
            [];


        // -----------------------------------------------
        // NO NOTIFICATIONS
        // -----------------------------------------------

        if (
            !Array.isArray(notifications) ||
            notifications.length === 0
        ) {

            container.className =
                "empty";

            container.innerHTML =
                "🔔 No notifications found.";

            return;

        }


        // =================================================
        // DISPLAY NOTIFICATIONS
        // =================================================

        let html = "";


        notifications.forEach(
            function(notification) {


                const title =
                    notification.title ||
                    notification.subject ||
                    "Notification";


                const message =
                    notification.message ||
                    notification.text ||
                    notification.content ||
                    "";


                const date =
                    notification.createdAt ||
                    notification.date ||
                    notification.createdDate;


                const isRead =
                    notification.read === true ||
                    notification.isRead === true;


                const notificationClass =
                    isRead
                        ? "notification"
                        : "notification unread";


                html += `

                    <div
                        class="${notificationClass}"
                    >

                        <div class="notification-title">

                            🔔
                            ${escapeHtml(title)}

                        </div>


                        <div class="notification-message">

                            ${escapeHtml(message)}

                        </div>


                        <div class="notification-date">

                            ${formatDate(date)}

                        </div>

                    </div>

                `;

            }
        );


        container.className = "";

        container.innerHTML = html;


    } catch (error) {

        console.error(
            "NOTIFICATION ERROR:",
            error
        );


        container.className =
            "error";


        container.innerHTML =
            "❌ Could not load notifications.<br><br>" +
            escapeHtml(
                error.message
            );

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// MAKE FUNCTION GLOBAL
// =====================================================

window.loadNotifications =
    loadNotifications;


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "✅ notification.html loaded"
        );

        loadNotifications();

    }
);


// =====================================================
// REFRESH WHEN USER RETURNS
// =====================================================

window.addEventListener(
    "pageshow",
    function () {

        loadNotifications();

    }
);


// =====================================================
// REFRESH EVERY 10 SECONDS
// =====================================================

setInterval(
    function () {

        loadNotifications();

    },
    10000
);


</script>

</body>

</html>
